name: bootstrap

# Once, on a fresh OpenBao. It creates the server, initializes it, applies the
# platform stack with the root token, creates your admin login, and revokes the
# root token. What you need to keep comes out as an age-encrypted artifact that
# only your private key can read; see the README.
on:
  workflow_dispatch:

concurrency:
  group: infra
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    environment: infra
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5
      - name: Bootstrap
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          TF_VAR_state_passphrase: ${{ secrets.TF_VAR_STATE_PASSPHRASE }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          BOOTSTRAP_AGE_RECIPIENT: ${{ vars.BOOTSTRAP_AGE_RECIPIENT }}
          BOOTSTRAP_BUNDLE: bootstrap-bundle.age
        run: mise run bootstrap
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: bootstrap-bundle
          path: bootstrap-bundle.age
          if-no-files-found: ignore
          retention-days: 7
