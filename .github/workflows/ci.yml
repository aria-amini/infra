name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint scripts and typecheck Pulumi
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Lint the shell tasks
        run: shellcheck mise-tasks/*
      - name: Set up Node for the review gate tests
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Test the review gate
        run: node --test actions/review-gate/src/*.test.ts
      - name: Set up Node and the npm cache
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pulumi/package-lock.json
      - name: Install the Pulumi program's dependencies
        working-directory: pulumi
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck the Pulumi program
        working-directory: pulumi
        run: npx tsc --noEmit

  oauth-broker:
    name: Test shared OAuth broker
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: oauth-broker/package-lock.json
      - name: Install dependencies
        working-directory: oauth-broker
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test the broker
        working-directory: oauth-broker
        run: npm test
